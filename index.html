<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tometu | iykyk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fun Easter Egg Animation */
        .tometu-theme { transition: all 0.5s ease; }
        .easter-egg-active { 
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff); 
            background-size: 400% 400%; 
            animation: rainbow 3s ease infinite; 
        }
        @keyframes rainbow { 
            0% { background-position: 0% 50% } 
            50% { background-position: 100% 50% } 
            100% { background-position: 0% 50% } 
        }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white flex items-center justify-center min-h-screen font-sans tometu-theme overflow-hidden selection:bg-red-500 selection:text-white" id="main-body">

    <div class="relative bg-[#1a1a1a] p-8 rounded-3xl shadow-[0_0_50px_rgba(255,99,71,0.1)] border border-red-500/20 max-w-md w-full text-center z-10 transition-transform duration-300 hover:scale-[1.02]">

        <h2 id="greeting" class="text-xl text-red-400 font-mono mb-2 tracking-tight">...</h2>
        
        <h1 class="text-6xl font-black mb-2 tracking-tighter cursor-default">tometu<span class="text-red-500 hover:text-white transition-colors duration-300">.</span></h1>
        <p class="text-gray-400 text-sm mb-8 italic">"Iykyk. Welcome to my chaos." 🍅</p>

        <div class="bg-black/50 p-4 rounded-2xl border border-gray-800 mb-4 text-left">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 bg-red-500/20 rounded-full flex items-center justify-center animate-pulse text-xl shadow-[0_0_15px_rgba(255,99,71,0.5)]">🎧</div>
                <div>
                    <p class="text-[10px] text-red-400 font-bold uppercase tracking-wider">Lifetime Vibe</p>
                    <p class="text-sm font-medium">The Official Tometu Anthem</p>
                </div>
            </div>
            <audio controls class="w-full h-8 opacity-70 hover:opacity-100 transition-opacity">
                <source src="YOUR_MP3_DIRECT_LINK_HERE" type="audio/mpeg">
            </audio>
        </div>

        <div id="spotify-container" class="bg-[#1DB954]/10 p-4 rounded-2xl border border-[#1DB954]/30 hidden flex items-center gap-4 text-left">
            <img id="spotify-art" src="" alt="Album Art" class="w-12 h-12 rounded-md shadow-lg">
            <div class="overflow-hidden">
                <p class="text-[10px] text-[#1DB954] font-bold uppercase tracking-widest">Listening Now</p>
                <p id="spotify-track" class="text-white font-bold text-sm truncate w-48"></p>
                <p id="spotify-artist" class="text-gray-400 text-xs truncate w-48"></p>
            </div>
        </div>
    </div>

    <div class="absolute bottom-5 right-5 w-6 h-6 opacity-0 hover:opacity-100 cursor-pointer text-xl transition-opacity duration-300 flex items-center justify-center" onclick="triggerEasterEgg()">🍅</div>

    <script>
        // --- LOGIC 1: DYNAMIC GREETING ---
        // Checks timezone. If it's Asia/Dhaka, says Bhalo achen.
        const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const greetingElement = document.getElementById('greeting');
        
        if (userTimezone === 'Asia/Dhaka') {
            greetingElement.innerText = "Bhalo achen? 👋";
        } else {
            greetingElement.innerText = "What's up? 🌍";
        }

        // --- LOGIC 2: EASTER EGG ---
        function triggerEasterEgg() {
            const body = document.getElementById('main-body');
            body.classList.toggle('easter-egg-active');
            
            // Plays a fun discord sound effect
            const audio = new Audio('https://www.myinstants.com/media/sounds/discord-notification.mp3');
            audio.play();

            // Changes the tab title
            document.title = body.classList.contains('easter-egg-active') ? "🎉 PARTY MODE 🎉" : "tometu | iykyk";
        }

        // --- LOGIC 3: SPOTIFY REAL-TIME STATUS ---
        // Put your Discord User ID here (Make sure Spotify is linked to your Discord and status is visible)
        const discordID = "YOUR_DISCORD_ID_HERE"; 
        
        async function fetchSpotifyStatus() {
            if(discordID === "YOUR_DISCORD_ID_HERE") return; 
            
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${discordID}`);
                const data = await res.json();
                const spotifyContainer = document.getElementById('spotify-container');
                
                // If user is playing Spotify
                if (data.data && data.data.spotify) {
                    const spotify = data.data.spotify;
                    document.getElementById('spotify-art').src = spotify.album_art_url;
                    document.getElementById('spotify-track').innerText = spotify.track;
                    document.getElementById('spotify-artist').innerText = spotify.artist;
                    spotifyContainer.classList.remove('hidden');
                } else {
                    spotifyContainer.classList.add('hidden');
                }
            } catch (error) {
                console.log("Not listening to Spotify right now.");
            }
        }

        // Fetch immediately, then check every 5 seconds
        fetchSpotifyStatus();
        setInterval(fetchSpotifyStatus, 5000);
    </script>
</body>
</html>
