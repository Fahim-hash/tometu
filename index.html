<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tometu. | home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Bento Grid Styling */
        .bento-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 180px);
            gap: 1.2rem;
            max-width: 1000px;
            width: 100%;
        }

        .bento-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Hover Effect: Glow follows mouse */
        .bento-item::before {
            content: '';
            position: absolute;
            top: var(--y);
            left: var(--x);
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.12), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .bento-item:hover::before { opacity: 1; }
        .bento-item:hover { border-color: rgba(255, 69, 0, 0.3); transform: translateY(-5px); }

        /* Specific Grid Spans */
        .item-1 { grid-column: span 2; grid-row: span 2; } 
        .item-2 { grid-column: span 2; }
        .item-3 { grid-column: span 1; }
        .item-4 { grid-column: span 1; }
        .item-5 { grid-column: span 2; }

        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03; pointer-events: none; z-index: 50;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        @keyframes float { 0%, 100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-5px); opacity: 0.8; } }
        .coming-soon { animation: float 3s ease-in-out infinite; }
        
        .is-playing { background: #ff4500 !important; color: white !important; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 selection:bg-orange-600">
    <div class="noise"></div>

    <div class="mb-12 text-center">
        <div id="greeting" class="text-[10px] tracking-[0.5em] text-gray-600 uppercase mb-4">...</div>
        <h1 class="text-5xl font-black tracking-tighter">tometu<span class="text-orange-600">.</span></h1>
    </div>

    <div class="bento-container">
        <div class="bento-item item-1 p-10 flex flex-col justify-end">
            <div class="w-12 h-12 rounded-full bg-orange-600 flex items-center justify-center text-xl mb-6 shadow-lg">🍅</div>
            <h3 class="text-3xl font-black mb-2 tracking-tight">Creative Direction</h3>
            <p class="text-gray-500 text-sm leading-relaxed">Shaping digital experiences with precision and passion since 2024. Stay tuned for the full reveal.</p>
        </div>

        <div class="bento-item item-2 p-8 flex items-center justify-between cursor-pointer group" onclick="togglePlay()">
            <div>
                <p class="text-[10px] uppercase tracking-widest text-orange-600 font-bold mb-1">Atmosphere</p>
                <p class="text-xl font-bold">The Theme Song</p>
            </div>
            <div id="play-btn" class="w-14 h-14 rounded-full bg-white/5 flex items-center justify-center transition-all text-orange-500">
                <i id="play-icon" class="fas fa-play ml-1"></i>
            </div>
            <audio id="main-audio" loop>
                <source src="assets/ssstik.io_1774868268255.mp3" type="audio/mpeg">
            </audio>
        </div>

        <a href="/fun" class="bento-item item-3 flex flex-col items-center justify-center gap-3 group">
            <i class="fas fa-wand-magic-sparkles text-2xl text-gray-600 group-hover:text-orange-500 transition-colors"></i>
            <span class="text-[9px] uppercase tracking-widest font-bold text-gray-500">Vibe</span>
        </a>

        <a href="/terminal" class="bento-item item-4 flex flex-col items-center justify-center gap-3 group">
            <i class="fas fa-terminal text-2xl text-gray-600 group-hover:text-orange-500 transition-colors"></i>
            <span class="text-[9px] uppercase tracking-widest font-bold text-gray-500">Shell</span>
        </a>

        <div class="bento-item item-5 p-8 flex items-center justify-center">
            <p class="text-gray-500 italic text-sm text-center leading-relaxed font-medium">"Design is not just what it looks like. Design is how it works."</p>
        </div>
    </div>

    <div class="mt-12 text-center">
        <p class="coming-soon text-[10px] font-bold tracking-[0.5em] uppercase text-gray-700">Experience Coming Soon</p>
    </div>

    <script>
        // Magnetic Effect Logic
        const items = document.querySelectorAll('.bento-item');
        items.forEach(item => {
            item.addEventListener('mousemove', (e) => {
                const rect = item.getBoundingClientRect();
                item.style.setProperty('--x', `${e.clientX - rect.left}px`);
                item.style.setProperty('--y', `${e.clientY - rect.top}px`);
            });
        });

        // Greeting Logic
        const greet = document.getElementById('greeting');
        greet.innerText = Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Dhaka' ? "Bhalo achen? 👋" : "What's up? 🌍";

        // Audio Logic
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-btn');
        const icon = document.getElementById('play-icon');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                icon.classList.replace('fa-play', 'fa-pause');
                icon.classList.remove('ml-1');
                playBtn.classList.add('is-playing');
            } else {
                audio.pause();
                icon.classList.replace('fa-pause', 'fa-play');
                icon.classList.add('ml-1');
                playBtn.classList.remove('is-playing');
            }
        }
    </script>
</body>
</html>
