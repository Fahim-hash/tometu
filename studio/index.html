<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tometu Studio — Creative OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--panel:#111114;--panel2:#151519;--line:#25252b;--muted:#8b8b95;--text:#f5f5f7;--accent:#ff5a1f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}body{min-height:100vh}.brand{font-family:Manrope,sans-serif}.glass{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.2)}.sidebar{border-right:1px solid var(--line);background:#0b0b0e}.nav-item{color:#8e8e98;transition:.18s}.nav-item:hover,.nav-item.active{color:#fff;background:#18181d}.nav-item.active{box-shadow:inset 2px 0 0 var(--accent)}.btn{transition:.18s}.btn:hover{transform:translateY(-1px)}.progress{background:#25252b}.progress>span{background:var(--accent)}.pill{border:1px solid #2a2a31;background:#17171c}.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.chartbar{background:linear-gradient(180deg,#ff7a42,#ff5a1f)}.scrollbar::-webkit-scrollbar{width:6px}.scrollbar::-webkit-scrollbar-thumb{background:#2b2b32;border-radius:99px}.modal{background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}input,textarea,select{outline:none}.field{background:#0d0d10;border:1px solid #29292f}.field:focus{border-color:#57575f;box-shadow:0 0 0 3px rgba(255,90,31,.08)}@media(max-width:900px){.sidebar{width:76px}.nav-label,.workspace-copy{display:none}.main{margin-left:76px!important}.sidebar .logo-word{display:none}.nav-item{justify-content:center}.sidebar .section-label{display:none}}@media(max-width:640px){.sidebar{display:none}.main{margin-left:0!important}.mobile-top{display:flex!important}.grid4{grid-template-columns:1fr 1fr!important}.grid3{grid-template-columns:1fr!important}.top-actions .hide-mobile{display:none}.page{padding:20px!important}}
</style>
</head>
<body>
<aside class="sidebar fixed inset-y-0 left-0 z-30 w-64 p-4 flex flex-col">
  <div class="h-14 flex items-center gap-3 px-3 mb-5">
    <div class="w-9 h-9 rounded-xl bg-white text-black grid place-items-center font-black brand">T.</div>
    <div class="logo-word"><div class="brand font-extrabold tracking-tight">tometu<span style="color:var(--accent)">.</span>studio</div><div class="text-[10px] text-zinc-600 tracking-wider uppercase">Creative OS</div></div>
  </div>
  <div class="section-label px-3 mb-2 text-[10px] font-bold uppercase tracking-[.18em] text-zinc-600">Workspace</div>
  <nav id="nav" class="space-y-1">
    <button data-view="overview" class="nav-item active w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span class="nav-label">Overview</span></button>
    <button data-view="projects" class="nav-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="folder-kanban" class="w-4 h-4"></i><span class="nav-label">Projects</span><span id="projectCount" class="nav-label ml-auto text-[10px] text-zinc-600">4</span></button>
    <button data-view="tasks" class="nav-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="check-square-2" class="w-4 h-4"></i><span class="nav-label">Tasks</span></button>
    <button data-view="moodboards" class="nav-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="panels-top-left" class="w-4 h-4"></i><span class="nav-label">Moodboards</span></button>
    <button data-view="versions" class="nav-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="git-compare-arrows" class="w-4 h-4"></i><span class="nav-label">Versions</span></button>
    <button data-view="feedback" class="nav-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="message-square-more" class="w-4 h-4"></i><span class="nav-label">Feedback</span><span class="nav-label ml-auto text-[10px] text-orange-400">3</span></button>
    <button data-view="deliveries" class="nav-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="send" class="w-4 h-4"></i><span class="nav-label">Deliveries</span></button>
  </nav>
  <div class="section-label px-3 mt-7 mb-2 text-[10px] font-bold uppercase tracking-[.18em] text-zinc-600">Tools</div>
  <nav class="space-y-1">
    <button data-view="brief" class="nav-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="file-pen-line" class="w-4 h-4"></i><span class="nav-label">Brief Builder</span></button>
    <button data-view="decisions" class="nav-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left"><i data-lucide="lightbulb" class="w-4 h-4"></i><span class="nav-label">Decision Log</span></button>
  </nav>
  <div class="mt-auto glass rounded-2xl p-3">
    <div class="flex items-center gap-2 mb-3"><div class="w-8 h-8 rounded-full bg-gradient-to-br from-orange-400 to-red-700 grid place-items-center text-xs font-bold">F</div><div class="nav-label min-w-0"><div class="text-xs font-semibold truncate">Fahim's Workspace</div><div class="text-[10px] text-zinc-600">Personal Creative OS</div></div></div>
    <button data-view="settings" class="nav-item w-full flex items-center gap-2 rounded-lg px-2 py-2 text-xs"><i data-lucide="settings-2" class="w-3.5 h-3.5"></i><span class="nav-label">Workspace settings</span></button>
  </div>
</aside>

<main class="main ml-64 min-h-screen">
  <div class="mobile-top hidden h-14 border-b border-zinc-800 px-4 items-center justify-between"><div class="brand font-bold">tometu<span class="text-orange-500">.</span>studio</div><button onclick="openCreate()" class="btn w-9 h-9 rounded-lg bg-white text-black grid place-items-center"><i data-lucide="plus" class="w-4 h-4"></i></button></div>
  <header class="h-16 border-b border-zinc-800/80 flex items-center justify-between px-7 sticky top-0 z-20 bg-[#09090b]/90 backdrop-blur-xl">
    <div><div class="text-[10px] uppercase tracking-[.18em] text-zinc-600">Workspace / <span id="crumb">Overview</span></div><div id="headerTitle" class="brand font-bold mt-0.5">Good evening, Fahim.</div></div>
    <div class="top-actions flex items-center gap-2"><button class="hide-mobile btn w-9 h-9 rounded-lg border border-zinc-800 text-zinc-500 hover:text-white grid place-items-center" title="Search"><i data-lucide="search" class="w-4 h-4"></i></button><button class="hide-mobile btn w-9 h-9 rounded-lg border border-zinc-800 text-zinc-500 hover:text-white grid place-items-center" title="Notifications"><i data-lucide="bell" class="w-4 h-4"></i></button><button onclick="openCreate()" class="btn h-9 px-3 rounded-lg bg-white text-black text-xs font-bold flex items-center gap-2"><i data-lucide="plus" class="w-3.5 h-3.5"></i><span class="hide-mobile">New project</span></button></div>
  </header>
  <section id="app" class="page p-7 max-w-[1500px]"></section>
</main>

<div id="modal" class="modal hidden fixed inset-0 z-50 items-center justify-center p-5">
 <div class="glass rounded-2xl w-full max-w-lg p-6 bg-[#111114]">
  <div class="flex items-start justify-between"><div><div class="text-[10px] uppercase tracking-[.18em] text-orange-500 font-bold">Create</div><h2 class="brand text-xl font-bold mt-1">New project</h2></div><button onclick="closeModal()" class="text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
  <div class="grid gap-4 mt-6"><label class="text-xs text-zinc-500">Project name<input id="pName" class="field mt-2 w-full rounded-xl px-3 py-3 text-sm text-white" placeholder="e.g. MadeSiho — Summer Drop"></label><label class="text-xs text-zinc-500">Client<input id="pClient" class="field mt-2 w-full rounded-xl px-3 py-3 text-sm text-white" placeholder="Client / brand"></label><div class="grid grid-cols-2 gap-3"><label class="text-xs text-zinc-500">Type<select id="pType" class="field mt-2 w-full rounded-xl px-3 py-3 text-sm text-white"><option>Brand Identity</option><option>Social Campaign</option><option>Motion Graphics</option><option>Web Design</option></select></label><label class="text-xs text-zinc-500">Due date<input id="pDate" type="date" class="field mt-2 w-full rounded-xl px-3 py-3 text-sm text-white"></label></div></div>
  <div class="flex justify-end gap-2 mt-6"><button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-xs text-zinc-400 hover:text-white">Cancel</button><button onclick="createProject()" class="btn px-4 py-2.5 rounded-xl bg-white text-black text-xs font-bold">Create project</button></div>
 </div>
</div>

<script>
const seedProjects=[
{id:1,name:'MadeSiho — Summer Drop',client:'MadeSiho',type:'Brand Identity',status:'In progress',progress:72,due:'Sep 28',color:'orange',initials:'MS'},
{id:2,name:'EmissaryMUN — Ascend',client:'United Emissary Bangladesh',type:'Campaign',status:'Review',progress:88,due:'Oct 03',color:'violet',initials:'EM'},
{id:3,name:'TongerKhobor',client:'Personal Project',type:'Product Design',status:'In progress',progress:46,due:'Oct 12',color:'blue',initials:'TK'},
{id:4,name:'PayPilot Identity',client:'Assessment',type:'Brand Identity',status:'Draft',progress:24,due:'Oct 18',color:'emerald',initials:'PP'}];
let projects=JSON.parse(localStorage.getItem('tometuStudioProjects')||'null')||seedProjects;
const tasks=[
['Finalize typography system','MadeSiho — Summer Drop','Today','high'],['Export MUN social pack v3','EmissaryMUN — Ascend','Tomorrow','high'],['Write TongerKhobor case-study outline','TongerKhobor','Sep 27','medium'],['Prepare PayPilot presentation','PayPilot Identity','Sep 29','medium'],['Collect client logo assets','MadeSiho — Summer Drop','Sep 30','low']];
const views={
overview:{label:'Overview',title:'Good evening, Fahim.'},
projects:{label:'Projects',title:'Projects'},
tasks:{label:'Tasks',title:'Your workflow'},
moodboards:{label:'Moodboards',title:'Visual direction'},
versions:{label:'Versions',title:'Design versions'},
feedback:{label:'Feedback',title:'Feedback & approvals'},
deliveries:{label:'Deliveries',title:'Delivery center'},
brief:{label:'Brief Builder',title:'Creative Brief Builder'},
decisions:{label:'Decision Log',title:'Design Decision Log'},
settings:{label:'Settings',title:'Workspace settings'}
};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function projectCard(p){return '<div class="glass rounded-2xl p-5 hover:border-zinc-700 transition cursor-pointer" onclick="showProject('+p.id+')"><div class="flex items-start justify-between gap-3"><div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-xl bg-zinc-800 grid place-items-center text-xs font-bold">'+esc(p.initials)+'</div><div class="min-w-0"><div class="font-semibold text-sm truncate">'+esc(p.name)+'</div><div class="text-xs text-zinc-600 mt-1 truncate">'+esc(p.client)+' · '+esc(p.type)+'</div></div></div><span class="pill rounded-full px-2 py-1 text-[10px] '+(p.status==='Review'?'text-amber-300':'text-zinc-400')+'">'+esc(p.status)+'</span></div><div class="mt-5 flex justify-between text-[10px] text-zinc-600"><span>Progress</span><span>'+p.progress+'%</span></div><div class="progress h-1.5 rounded-full mt-2 overflow-hidden"><span style="display:block;height:100%;width:'+p.progress+'%"></span></div><div class="flex justify-between mt-4 text-[10px] text-zinc-600"><span>Due '+esc(p.due)+'</span><span class="text-zinc-500">Open →</span></div></div>'}
function stat(label,value,sub,icon){return '<div class="glass rounded-2xl p-5"><div class="flex justify-between"><span class="text-xs text-zinc-500">'+label+'</span><i data-lucide="'+icon+'" class="w-4 h-4 text-zinc-600"></i></div><div class="brand text-2xl font-bold mt-4">'+value+'</div><div class="text-[10px] text-zinc-600 mt-1">'+sub+'</div></div>'}
function renderOverview(){return '<div class="fade"><div class="flex items-end justify-between mb-6"><div><div class="text-xs text-zinc-500">Your creative command center</div><h1 class="brand text-3xl font-extrabold tracking-tight mt-1">Everything in one place.</h1></div><button onclick="openCreate()" class="btn px-4 py-2.5 rounded-xl bg-white text-black text-xs font-bold flex gap-2 items-center"><i data-lucide="sparkles" class="w-4 h-4"></i>Start a project</button></div><div class="grid grid-cols-4 gap-4 grid4">'+stat('Active projects','4','2 need attention','folder-kanban')+stat('Open tasks','12','3 due this week','check-circle-2')+stat('Awaiting feedback','3','1 client approval','message-square-more')+stat('This week','18h','creative time logged','timer')+'</div><div class="grid grid-cols-3 gap-4 grid3 mt-4"><div class="glass rounded-2xl p-5 col-span-2"><div class="flex justify-between items-center mb-6"><div><h3 class="font-semibold text-sm">Project velocity</h3><p class="text-[10px] text-zinc-600 mt-1">Creative output · last 8 weeks</p></div><span class="pill rounded-lg px-2.5 py-1 text-[10px] text-zinc-500">8 weeks</span></div><div class="h-44 flex items-end gap-3 border-b border-zinc-800/70 px-2">'+[38,52,44,68,57,79,72,92].map((v,i)=>'<div class="flex-1 h-full flex items-end gap-1"><div class="chartbar rounded-t-md w-full opacity-['+(0.35+i*.07)+']" style="height:'+v+'%"></div></div>').join('')+'</div><div class="flex justify-between mt-3 text-[9px] text-zinc-700"><span>Aug 3</span><span>Aug 17</span><span>Aug 31</span><span>Sep 14</span><span>Sep 23</span></div></div><div class="glass rounded-2xl p-5"><div class="flex justify-between"><div><h3 class="font-semibold text-sm">Needs attention</h3><p class="text-[10px] text-zinc-600 mt-1">Keep the pipeline moving</p></div><i data-lucide="zap" class="w-4 h-4 text-orange-500"></i></div><div class="space-y-3 mt-5">'+[['3','Client feedback','EmissaryMUN — Ascend','message-circle'],['2','Tasks overdue','MadeSiho — Summer Drop','clock-3'],['1','Approval pending','Social pack v3','stamp']].map(x=>'<div class="p-3 rounded-xl bg-white/[.025] border border-zinc-800/70 flex gap-3"><div class="w-8 h-8 rounded-lg bg-zinc-900 grid place-items-center text-orange-400 text-xs font-bold">'+x[0]+'</div><div class="min-w-0"><div class="text-xs font-medium">'+x[1]+'</div><div class="text-[10px] text-zinc-600 truncate mt-1">'+x[2]+'</div></div><i data-lucide="'+x[3]+'" class="w-3.5 h-3.5 ml-auto text-zinc-700"></i></div>').join('')+'</div></div></div><div class="mt-7 flex items-center justify-between"><div><h2 class="brand text-lg font-bold">Active projects</h2><p class="text-[10px] text-zinc-600 mt-1">Your current creative pipeline</p></div><button onclick="setView('projects')" class="text-xs text-zinc-500 hover:text-white">View all →</button></div><div class="grid grid-cols-2 gap-4 grid3 mt-4">'+projects.slice(0,4).map(projectCard).join('')+'</div></div>'}
function renderProjects(){return '<div class="fade"><div class="flex justify-between items-end mb-6"><div><div class="text-xs text-zinc-500">Workspace / Projects</div><h1 class="brand text-3xl font-extrabold mt-1">Project pipeline</h1></div><button onclick="openCreate()" class="btn px-4 py-2.5 rounded-xl bg-white text-black text-xs font-bold">+ New project</button></div><div class="flex gap-2 mb-4"><span class="pill rounded-lg px-3 py-2 text-xs text-white">All projects</span><span class="pill rounded-lg px-3 py-2 text-xs text-zinc-500">In progress</span><span class="pill rounded-lg px-3 py-2 text-xs text-zinc-500">Review</span></div><div class="grid grid-cols-2 gap-4 grid3">'+projects.map(projectCard).join('')+'</div></div>'}
function renderTasks(){return '<div class="fade"><div class="mb-6"><div class="text-xs text-zinc-500">Workspace / Tasks</div><h1 class="brand text-3xl font-extrabold mt-1">Your workflow</h1><p class="text-xs text-zinc-600 mt-2">Turn creative direction into clear next actions.</p></div><div class="grid grid-cols-3 gap-4 grid3">'+[['Today',tasks.filter(t=>t[2]==='Today')],['Upcoming',tasks.filter(t=>t[2]!=='Today')],['Completed',[]]].map((col,idx)=>'<div class="glass rounded-2xl p-4 min-h-[330px]"><div class="flex justify-between mb-4"><span class="font-semibold text-sm">'+col[0]+'</span><span class="text-[10px] text-zinc-700">'+col[1].length+'</span></div><div class="space-y-2">'+(col[1].length?col[1]:idx===2?[['Homepage visual polish','Tometu','Sep 22','done']]:[['No tasks here','You are clear','', '']]).map(t=>'<div class="rounded-xl border border-zinc-800/80 bg-white/[.02] p-3"><div class="flex gap-2"><div class="w-4 h-4 rounded-full border border-zinc-700 mt-0.5 '+(t[3]==='done'?'bg-orange-500 border-orange-500':'')+'"></div><div class="flex-1"><div class="text-xs font-medium">'+esc(t[0])+'</div><div class="text-[10px] text-zinc-600 mt-1">'+esc(t[1])+'</div></div></div><div class="mt-3 text-[9px] '+(t[3]==='high'?'text-orange-400':'text-zinc-600')+'">'+esc(t[2])+'</div></div>').join('')+'</div></div>').join('')+'</div></div>'}
function renderMoodboards(){return '<div class="fade"><div class="mb-6"><div class="text-xs text-zinc-500">Workspace / Moodboards</div><h1 class="brand text-3xl font-extrabold mt-1">Visual direction</h1></div><div class="grid grid-cols-3 gap-4 grid3">'+[['MadeSiho','Raw / monochrome / youth','orange'],['Ascend of the Phoenix','Ceremonial / cinematic / red','red'],['TongerKhobor','Editorial / local / bold','blue']].map((m,i)=>'<div class="glass rounded-2xl overflow-hidden"><div class="h-44 bg-gradient-to-br '+(i===0?'from-zinc-800 via-zinc-950 to-orange-950':i===1?'from-red-950 via-zinc-950 to-orange-950':'from-blue-950 via-zinc-950 to-zinc-950')+' p-5 flex items-end"><div class="text-2xl brand font-extrabold">'+m[0]+'</div></div><div class="p-4"><div class="text-sm font-semibold">'+m[0]+'</div><div class="text-xs text-zinc-600 mt-1">'+m[1]+'</div><button class="mt-4 text-[10px] text-zinc-500 hover:text-white">Open moodboard →</button></div></div>').join('')+'</div></div>'}
function renderVersions(){return '<div class="fade"><div class="mb-6"><div class="text-xs text-zinc-500">Workspace / Versions</div><h1 class="brand text-3xl font-extrabold mt-1">Design versions</h1></div><div class="glass rounded-2xl overflow-hidden"><div class="grid grid-cols-[1fr_130px_120px_110px] gap-4 px-5 py-3 border-b border-zinc-800 text-[10px] uppercase tracking-wider text-zinc-600"><span>Asset</span><span>Version</span><span>Status</span><span>Updated</span></div>'+[['MadeSiho social campaign','V3','Approved','2h ago'],['Ascend key visual','V7','Client review','Yesterday'],['TongerKhobor homepage','V4','Internal review','Sep 21'],['PayPilot wordmark','V2','Draft','Sep 20']].map(x=>'<div class="grid grid-cols-[1fr_130px_120px_110px] gap-4 px-5 py-4 border-b border-zinc-900 text-xs items-center"><span class="font-medium">'+x[0]+'</span><span class="text-zinc-500">'+x[1]+'</span><span class="text-zinc-500">'+x[2]+'</span><span class="text-zinc-600 text-[10px]">'+x[3]+'</span></div>').join('')+'</div></div>'}
function renderFeedback(){return '<div class="fade"><div class="mb-6"><div class="text-xs text-zinc-500">Workspace / Feedback</div><h1 class="brand text-3xl font-extrabold mt-1">Feedback & approvals</h1></div><div class="grid grid-cols-3 gap-4 grid3"><div class="glass rounded-2xl p-5 col-span-2"><div class="flex justify-between mb-5"><div><h3 class="font-semibold text-sm">Client review queue</h3><p class="text-[10px] text-zinc-600 mt-1">Comments attached to specific design versions</p></div><span class="pill px-2 py-1 rounded-full text-[10px] text-orange-400">3 open</span></div>'+[['Hero composition','“Can we make the headline feel less centered?”','EmissaryMUN — V7','2h ago'],['CTA treatment','“Please test a stronger contrast on mobile.”','MadeSiho — V3','Yesterday'],['Logo spacing','“The mark needs a little more breathing room.”','PayPilot — V2','Sep 20']].map(x=>'<div class="p-4 border border-zinc-800/80 rounded-xl mb-3"><div class="flex gap-3"><div class="w-8 h-8 rounded-lg bg-zinc-800 grid place-items-center"><i data-lucide="message-square" class="w-3.5 h-3.5 text-zinc-400"></i></div><div class="flex-1"><div class="text-xs font-semibold">'+x[0]+'</div><div class="text-xs text-zinc-500 mt-2">'+x[1]+'</div><div class="text-[9px] text-zinc-700 mt-3">'+x[2]+' · '+x[3]+'</div></div><button class="text-[10px] text-orange-400">Resolve</button></div></div>').join('')+'</div><div class="glass rounded-2xl p-5"><h3 class="font-semibold text-sm">Approval status</h3><div class="space-y-4 mt-5">'+[['Social pack','Approved'],['Key visual','Pending'],['Brand guide','Approved'],['Web hero','Pending']].map(x=>'<div class="flex justify-between items-center"><span class="text-xs text-zinc-400">'+x[0]+'</span><span class="text-[10px] '+(x[1]==='Approved'?'text-emerald-400':'text-amber-400')+'">'+x[1]+'</span></div>').join('')+'</div></div></div></div>'}
function renderDeliveries(){return '<div class="fade"><div class="mb-6"><div class="text-xs text-zinc-500">Workspace / Deliveries</div><h1 class="brand text-3xl font-extrabold mt-1">Delivery center</h1></div><div class="grid grid-cols-2 gap-4 grid3">'+[['MadeSiho final social pack','18 files','Ready to deliver'],['EmissaryMUN campaign assets','32 files','Awaiting approval'],['TongerKhobor brand package','12 files','In preparation'],['PayPilot assessment','8 files','Delivered']].map((x,i)=>'<div class="glass rounded-2xl p-5"><div class="w-10 h-10 rounded-xl bg-zinc-900 grid place-items-center"><i data-lucide="package-check" class="w-4 h-4 text-zinc-400"></i></div><h3 class="font-semibold text-sm mt-4">'+x[0]+'</h3><div class="text-[10px] text-zinc-600 mt-1">'+x[1]+'</div><div class="flex justify-between items-center mt-5"><span class="text-[10px] '+(x[2]==='Delivered'?'text-emerald-400':'text-zinc-500')+'">'+x[2]+'</span><button class="text-[10px] text-zinc-500 hover:text-white">Open →</button></div></div>').join('')+'</div></div>'}
function renderBrief(){return '<div class="fade"><div class="mb-6"><div class="text-xs text-zinc-500">Tools / Brief Builder</div><h1 class="brand text-3xl font-extrabold mt-1">Build a creative brief.</h1><p class="text-xs text-zinc-600 mt-2">Turn a vague request into a production-ready direction.</p></div><div class="grid grid-cols-3 gap-4 grid3"><div class="glass rounded-2xl p-5 col-span-2 space-y-4">'+[['Objective','What should this work achieve?','Increase awareness for the new collection.'],['Audience','Who are we designing for?','Bangladeshi Gen-Z / young adults.'],['Direction','What should it feel like?','Bold, tactile, confident, editorial.'],['Deliverables','What needs to ship?','3 feed posts, 5 stories, 1 hero visual.']].map(x=>'<label class="block text-xs text-zinc-500">'+x[0]+'<textarea class="field mt-2 w-full rounded-xl p-3 text-sm text-white min-h-24" placeholder="'+x[1]+'">'+x[2]+'</textarea></label>').join('')+'<button class="btn px-4 py-2.5 rounded-xl bg-white text-black text-xs font-bold">Save brief</button></div><div class="glass rounded-2xl p-5 h-fit"><div class="text-[10px] uppercase tracking-wider text-orange-500 font-bold">Brief health</div><div class="brand text-4xl font-extrabold mt-4">82%</div><p class="text-xs text-zinc-600 mt-1">Strong starting point.</p><div class="progress h-1.5 rounded-full mt-5"><span style="display:block;width:82%;height:100%"></span></div><div class="mt-5 space-y-3 text-xs"><div>✓ Objective defined</div><div>✓ Audience defined</div><div>✓ Deliverables defined</div><div class="text-zinc-600">○ References missing</div></div></div></div></div>'}
function renderDecisions(){return '<div class="fade"><div class="mb-6"><div class="text-xs text-zinc-500">Tools / Decision Log</div><h1 class="brand text-3xl font-extrabold mt-1">Why we designed it this way.</h1><p class="text-xs text-zinc-600 mt-2">Capture the reasoning behind creative decisions so future-you never has to guess.</p></div><div class="glass rounded-2xl p-5"><div class="space-y-3">'+[['Color system','Orange accent was chosen to create urgency against a neutral foundation while keeping the interface editorial.','MadeSiho'],['Typography','A condensed display face was avoided because the identity needs to work across long-form product pages.','PayPilot'],['Layout','The hero was intentionally asymmetric to create a stronger visual entry point on mobile.','TongerKhobor']].map(x=>'<div class="border border-zinc-800/80 rounded-xl p-4"><div class="flex justify-between"><div class="text-sm font-semibold">'+x[0]+'</div><span class="text-[9px] text-zinc-700">'+x[2]+'</span></div><p class="text-xs text-zinc-500 leading-6 mt-2">'+x[1]+'</p></div>').join('')+'</div></div></div>'}
function renderSettings(){return '<div class="fade"><div class="mb-6"><div class="text-xs text-zinc-500">Workspace / Settings</div><h1 class="brand text-3xl font-extrabold mt-1">Workspace settings</h1></div><div class="glass rounded-2xl p-6 max-w-2xl"><div class="flex items-center gap-4 pb-6 border-b border-zinc-800"><div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-400 to-red-700 grid place-items-center text-xl font-bold">F</div><div><div class="font-semibold">Fahim's Workspace</div><div class="text-xs text-zinc-600 mt-1">Personal Creative OS</div></div></div><div class="py-6 space-y-5"><label class="block text-xs text-zinc-500">Workspace name<input class="field mt-2 w-full rounded-xl px-3 py-3 text-sm" value="Fahim's Workspace"></label><label class="block text-xs text-zinc-500">Public review base URL<input class="field mt-2 w-full rounded-xl px-3 py-3 text-sm" value="https://tometu.ami/studio/review/" readonly></label></div><button class="px-4 py-2.5 rounded-xl bg-white text-black text-xs font-bold">Save changes</button></div></div>'}
function showProject(id){const p=projects.find(x=>x.id===id); if(!p)return; app.innerHTML='<div class="fade"><button onclick="setView(\'projects\')" class="text-xs text-zinc-500 hover:text-white mb-5">← Back to projects</button><div class="flex justify-between items-start gap-4"><div><div class="text-[10px] uppercase tracking-wider text-orange-500 font-bold">'+p.status+'</div><h1 class="brand text-3xl font-extrabold mt-1">'+esc(p.name)+'</h1><p class="text-xs text-zinc-600 mt-2">'+esc(p.client)+' · '+esc(p.type)+' · Due '+esc(p.due)+'</p></div><button class="btn px-4 py-2.5 rounded-xl border border-zinc-800 text-xs">Share review link</button></div><div class="grid grid-cols-4 gap-4 grid4 mt-7">'+stat('Progress',p.progress+'%','Overall completion','activity')+stat('Versions','7','Latest V7','git-branch')+stat('Feedback','3','2 unresolved','message-square')+stat('Files','18','2.4 GB workspace','paperclip')+'</div><div class="grid grid-cols-3 gap-4 grid3 mt-4"><div class="glass rounded-2xl p-5 col-span-2"><div class="flex justify-between"><h3 class="font-semibold text-sm">Project workspace</h3><span class="pill rounded-lg px-2 py-1 text-[10px]">Live</span></div><div class="grid grid-cols-4 gap-2 mt-5">'+['Overview','Brief','Tasks','Files','Moodboard','Versions','Feedback','Delivery'].map((x,i)=>'<button class="rounded-xl border border-zinc-800 p-4 text-left hover:bg-white/[.03]"><i data-lucide="'+['layout-dashboard','file-pen-line','check-square','folder','panels-top-left','git-compare','message-square','send'][i]+'" class="w-4 h-4 text-zinc-500"></i><div class="text-xs font-medium mt-3">'+x+'</div><div class="text-[9px] text-zinc-700 mt-1">'+(i===0?'Project summary':i===1?'Creative direction':i===2?'4 open tasks':'Open section')+'</div></button>').join('')+'</div></div><div class="glass rounded-2xl p-5"><h3 class="font-semibold text-sm">Next milestone</h3><div class="text-2xl brand font-bold mt-5">Client review</div><p class="text-xs text-zinc-600 mt-2">Prepare V7 and send the review link.</p><div class="progress h-1.5 rounded-full mt-5"><span style="display:block;height:100%;width:'+p.progress+'%"></span></div><div class="text-[10px] text-zinc-600 mt-2">'+p.progress+'% complete</div></div></div></div>';lucide.createIcons()}
function setView(view){location.hash=view;render(view)}
function render(view){view=view||location.hash.replace('#','')||'overview';if(!views[view])view='overview';document.querySelectorAll('.nav-item[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===view));document.getElementById('crumb').textContent=views[view].label;document.getElementById('headerTitle').textContent=views[view].title;const r={overview:renderOverview,projects:renderProjects,tasks:renderTasks,moodboards:renderMoodboards,versions:renderVersions,feedback:renderFeedback,deliveries:renderDeliveries,brief:renderBrief,decisions:renderDecisions,settings:renderSettings}[view];r();document.getElementById('projectCount').textContent=projects.length;lucide.createIcons()}
function openCreate(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex');document.getElementById('pDate').value=new Date(Date.now()+7*86400000).toISOString().slice(0,10)}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex')}
function createProject(){const name=document.getElementById('pName').value.trim(),client=document.getElementById('pClient').value.trim()||'Independent',type=document.getElementById('pType').value,date=document.getElementById('pDate').value;if(!name){document.getElementById('pName').focus();return}const d=date?new Date(date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'TBD';projects.unshift({id:Date.now(),name,client,type,status:'Draft',progress:0,due:d,color:'zinc',initials:name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()});localStorage.setItem('tometuStudioProjects',JSON.stringify(projects));closeModal();document.getElementById('pName').value='';document.getElementById('pClient').value='';setView('projects')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});window.addEventListener('hashchange',()=>render());render();lucide.createIcons();
</script>
</body>
