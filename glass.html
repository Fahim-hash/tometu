<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tometu. | bento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap');
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Bento Grid Styling */
        .bento-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 180px);
            gap: 1.5rem;
            max-width: 1000px;
            width: 100%;
        }

        .bento-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }

        /* Hover Effect: Glow follows mouse */
        .bento-item::before {
            content: '';
            position: absolute;
            top: var(--y);
            left: var(--x);
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .bento-item:hover::before { opacity: 1; }
        .bento-item:hover { border-color: rgba(255, 69, 0, 0.3); transform: translateY(-5px); }

        /* Specific Grid Spans */
        .item-1 { grid-column: span 2; grid-row: span 2; } /* Large Featured Box */
        .item-2 { grid-column: span 2; }
        .item-3 { grid-column: span 1; }
        .item-4 { grid-column: span 1; }
        .item-5 { grid-column: span 2; }

        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03; pointer-events: none; z-index: 50;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="noise"></div>

    <div class="mb-12 text-center">
        <a href="/" class="text-[10px] tracking-[0.5em] text-gray-600 hover:text-orange-500 transition-all uppercase mb-4 block">← Escape to Home</a>
        <h1 class="text-4xl font-extrabold tracking-tighter">tometu<span class="text-orange-600">.</span>bento</h1>
    </div>

    <div class="bento-container">
        <div class="bento-item item-1 p-8 flex flex-col justify-end">
            <h3 class="text-2xl font-bold mb-2">Creative Direction</h3>
            <p class="text-gray-500 text-sm">Shaping digital experiences with precision and passion since 2024.</p>
        </div>

        <div class="bento-item item-2 p-8 flex items-center justify-between">
            <div>
                <p class="text-[10px] uppercase tracking-widest text-orange-600 font-bold mb-1">Status</p>
                <p class="text-xl font-medium">Available for Projects</p>
            </div>
            <div class="text-4xl">🚀</div>
        </div>

        <div class="bento-item item-3 flex items-center justify-center text-4xl">
            🍅
        </div>

        <div class="bento-item item-4 flex items-center justify-center text-gray-700">
            <i class="fas fa-fingerprint text-3xl"></i>
        </div>

        <div class="bento-item item-5 p-8 flex flex-col justify-center">
            <p class="text-gray-400 italic text-sm">"Design is not just what it looks like and feels like. Design is how it works."</p>
        </div>
    </div>

    <script>
        // Magnetic Mouse Follow Effect for Bento Items
        const items = document.querySelectorAll('.bento-item');
        
        items.forEach(item => {
            item.addEventListener('mousemove', (e) => {
                const rect = item.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                item.style.setProperty('--x', `${x}px`);
                item.style.setProperty('--y', `${y}px`);
            });
        });
    </script>
    <script src="https://kit.fontawesome.com/your-kit-code.js" crossorigin="anonymous"></script>
</body>
</html>
