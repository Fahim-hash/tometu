<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tometu. | glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }

        /* The Grainy Background */
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(255, 69, 0, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 0, 0, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 69, 0, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(128, 0, 0, 0.1) 0px, transparent 50%);
            filter: blur(100px); z-index: -1;
        }

        /* SVG Noise Overlay */
        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.05; pointer-events: none; z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* 3D Glass Card */
        .card-wrapper { perspective: 1000px; z-index: 10; }
        .glass-card {
            width: 320px; height: 450px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform-style: preserve-3d; transition: transform 0.1s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .card-content { transform: translateZ(50px); text-align: center; }
    </style>
</head>
<body class="flex items-center justify-center">

    <div class="noise"></div>
    <div class="bg-mesh" id="mesh"></div>

    <div class="card-wrapper">
        <div class="glass-card" id="card">
            <div class="card-content">
                <div class="w-20 h-20 bg-orange-600 rounded-full mx-auto mb-6 shadow-[0_0_40px_rgba(255,69,0,0.4)] flex items-center justify-center text-3xl">🍅</div>
                <h2 class="text-white text-4xl font-black tracking-tighter mb-2 italic">TOMETU</h2>
                <p class="text-gray-500 text-[10px] tracking-[0.4em] uppercase">Depth & Dimension</p>
                
                <a href="/" class="mt-12 inline-block px-6 py-2 rounded-full border border-white/10 text-[9px] tracking-widest text-gray-400 hover:bg-white hover:text-black transition-all">RETURN</a>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const mesh = document.getElementById('mesh');

        document.addEventListener('mousemove', (e) => {
            // 3D Tilt Logic
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;

            // Subtle Background Shift
            mesh.style.transform = `translate(${xAxis * 2}px, ${yAxis * 2}px)`;
        });

        // Reset position on mouse leave
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
